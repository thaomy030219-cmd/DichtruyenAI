
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Dịch truyện AI - v1.0.2</title>
    
    <!-- Fonts: Sora for headings (v1.0.2, thay Outfit), Inter for body, Playfair/Cinzel for Cover Art, Merriweather/Lora for Content -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@400;500;600&family=Sora:wght@500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              // UPDATED v1.0.2: Outfit (bo tròn, mềm) -> Sora (kết cấu hình học, gọn, sắc nét
              // hơn) — đổi "chất chữ" của MỌI tiêu đề/nút bấm dùng font-display khắp app.
              display: ['Sora', 'sans-serif'],
              serif: ['Merriweather', 'Lora', 'serif'],
              content: ['Lora', 'serif'],
              // UPDATED v1.0.2: font tiêu đề văn học riêng cho IntroPage (khác hẳn Sora dùng
              // trong app) — hợp với chủ đề "truyện", đã có sẵn link Google Fonts ở trên.
              heading: ['"Playfair Display"', 'serif'],
            },
            // UPDATED v1.0.2: Thu gọn thang bo góc mặc định của Tailwind (rounded-lg/xl/2xl/3xl).
            // Bản trước dùng nguyên bo góc rất lớn của Tailwind (rounded-3xl = 24px) khắp nơi,
            // tạo cảm giác "bong bóng mềm". Đè lại đúng các mốc này (không cần sửa từng file vì
            // MỌI nơi trong app đều gọi qua đúng tên class rounded-lg/xl/2xl/3xl có sẵn) để chuyển
            // sang dáng vẻ gọn, sắc nét hơn — vẫn bo góc mềm mại, chỉ không "phồng" như trước.
            borderRadius: {
              'lg': '0.5rem',    // 8px (mặc định Tailwind: 8px, giữ nguyên làm mốc neo)
              'xl': '0.625rem',  // 10px (mặc định: 12px)
              '2xl': '0.875rem', // 14px (mặc định: 16px)
              '3xl': '1.25rem',  // 20px (mặc định: 24px)
            },
            // Typography phụ trợ: line-height rộng hơn cho vùng đọc chương
            // truyện dài (font-content), letter-spacing âm nhẹ cho heading
            // (font-display) để chữ to trông sắc nét, chuyên nghiệp hơn.
            lineHeight: {
              'reading': '1.85',
            },
            letterSpacing: {
              'heading': '-0.015em',
            },
            colors: {
              sky: {
                50: '#f0f9ff',
                100: '#e0f2fe',
                200: '#bae6fd',
                300: '#7dd3fc',
                400: '#38bdf8',
                500: '#0ea5e9',
                600: '#0284c7',
                700: '#0369a1',
                800: '#075985',
                900: '#0c4a6e',
              },
              slate: {
                850: '#1e293b', // Custom dark slate
                900: '#0f172a',
                950: '#020617', // Deepest slate
              },
              // Zen Dark Mode Colors
              zen: {
                bg: '#050505',
                card: '#0a0a0a',
                border: '#1a1a1a',
                text: '#e5e5e5',
                muted: '#a3a3a3'
              },
              // === DESIGN TOKENS (Bước 1) ===
              // Alias ngữ nghĩa cho màu accent chính, dùng thay cho "indigo" rải rác
              // để sau này đổi thương hiệu chỉ cần sửa 1 chỗ.
              // UPDATED v1.0.2: Đổi từ indigo/tím (lạnh, công nghệ) sang teal/xanh ngọc ấm áp,
              // thân thiện hơn — đổi đúng 1 chỗ này lan ra toàn bộ nút, viền, điểm nhấn khắp app
              // vì mọi nơi đều dùng alias `primary-*` thay vì hardcode "indigo".
              primary: {
                50: '#f0fdfa', 100: '#ccfbf1', 200: '#99f6e4', 300: '#5eead4',
                400: '#2dd4bf', 500: '#14b8a6', 600: '#0d9488', 700: '#0f766e',
                800: '#115e59', 900: '#134e4a',
              },
              // Màu ngữ nghĩa trạng thái — map theo đúng tông đang dùng
              // (emerald=success, amber=warning, rose=danger, sky=info) để
              // không phải đổi giá trị hex, chỉ thêm tên gọi rõ nghĩa hơn.
              success: {
                50: '#ecfdf5', 100: '#d1fae5', 400: '#34d399', 500: '#10b981',
                600: '#059669', 900: '#064e3b',
              },
              warning: {
                50: '#fffbeb', 100: '#fef3c7', 400: '#fbbf24', 500: '#f59e0b',
                600: '#d97706', 900: '#78350f',
              },
              danger: {
                50: '#fff1f2', 100: '#ffe4e6', 400: '#fb7185', 500: '#f43f5e',
                600: '#e11d48', 900: '#4c0519',
              },
              info: {
                50: '#f0f9ff', 100: '#e0f2fe', 400: '#38bdf8', 500: '#0ea5e9',
                600: '#0284c7', 900: '#0c4a6e',
              },
            },
            // Thang elevation thống nhất — dùng thay cho việc chọn ngẫu nhiên
            // shadow-sm/md/lg/xl/2xl ở mỗi component. Quy ước:
            //  elevation-1: item trong danh sách, hàng bảng (mặc định, tĩnh)
            //  elevation-2: card, panel (trạng thái nghỉ)
            //  elevation-3: card khi hover/kéo nổi lên
            //  elevation-4: dropdown, popover, tooltip
            //  elevation-5: modal, dialog (lớp trên cùng)
            //  glow-primary: viền sáng nhẹ cho nút CTA chính (thay shadow-indigo-500 tự phát)
            boxShadow: {
              'elevation-1': '0 1px 2px 0 rgba(6, 78, 74, 0.05)',
              'elevation-2': '0 2px 8px -2px rgba(6, 78, 74, 0.09), 0 1px 2px -1px rgba(6, 78, 74, 0.06)',
              'elevation-3': '0 8px 20px -4px rgba(6, 78, 74, 0.13), 0 2px 6px -2px rgba(6, 78, 74, 0.09)',
              'elevation-4': '0 16px 32px -8px rgba(6, 78, 74, 0.19)',
              'elevation-5': '0 24px 48px -12px rgba(6, 78, 74, 0.30)',
              'glow-primary': '0 0 0 1px rgba(20, 184, 166, 0.15), 0 4px 16px -2px rgba(20, 184, 166, 0.25)',
            },
            // Đường cong chuyển động chuẩn — "smooth" cho hover/transition UI nhỏ,
            // "in-out" cho việc mở/đóng panel, modal, sidebar.
            transitionTimingFunction: {
              'smooth': 'cubic-bezier(0.4, 0, 0.2, 1)',
            },
            animation: {
              'blob': 'blob 7s infinite',
            },
            keyframes: {
              blob: {
                '0%': { transform: 'translate(0px, 0px) scale(1)' },
                '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                '100%': { transform: 'translate(0px, 0px) scale(1)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      html, body {
        height: 100%;
        width: 100%;
        overflow: hidden; /* Prevent native scroll, force app scroll */
        overscroll-behavior-y: none; /* Prevent pull-to-refresh/rubber banding */
        touch-action: pan-x pan-y; /* Allow basic panning */
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      body {
        background-color: #f8fafc;
        color: #334155;
        font-size: 16px; /* Tăng size chữ cơ bản lên 16px */
      }
      
      /* Đồng bộ color-scheme với theme đang chọn, để control gốc của trình
         duyệt (thanh cuộn Firefox/Safari, input date/select, checkbox mặc định...)
         cũng đổi màu theo thay vì luôn hiện kiểu light bất kể đang ở dark mode. */
      :root { color-scheme: light; }
      .dark { color-scheme: dark; }

      /* Mesh Gradient Background - Light.
         UPDATED v1.0.2: đổi 3 vệt màu từ indigo/sky/purple (hue 234/199/255 - tông cũ) sang
         teal/amber (hue 173/38 - khớp với primary teal mới), để nền mờ phía sau xuyên suốt
         toàn app cũng đổi tông theo, không còn phảng phất sắc xanh dương/tím của bản gốc. */
      .mesh-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -1;
        background-color: #f8fafc;
        background-image: 
          radial-gradient(at 15% 10%, hsla(173,70%,45%,0.10) 0px, transparent 55%),
          radial-gradient(at 85% 15%, hsla(38,92%,60%,0.08) 0px, transparent 55%),
          radial-gradient(at 50% 100%, hsla(160,60%,50%,0.07) 0px, transparent 60%);
        transition: opacity 0.5s ease, background-color 0.4s ease;
      }

      /* Dark Mode Mesh Background - Zen Mode.
         Vẫn giữ tinh thần tối giản gần như đen tuyền, nhưng thêm 1 vệt sáng
         cực nhẹ (glow primary teal) ở góc trên để có chiều sâu, tránh cảm giác
         phẳng/chết của nền đen đặc hoàn toàn. */
      .dark .mesh-bg {
        background-color: #050505; /* True Black / Deepest Gray */
        background-image:
          radial-gradient(at 20% 0%, hsla(173,70%,45%,0.05) 0px, transparent 45%);
      }

      /* Subtle Grid Pattern Overlay */
      .grid-pattern {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%2394a3b8' fill-opacity='0.08'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      }
      
      .dark .grid-pattern {
        opacity: 0.03; /* Fainter grid for Zen */
      }
      
      /* Custom scrollbar (mặc định cho MỌI phần tử — kể cả những nơi
         không gắn class .custom-scrollbar) */
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.02); 
      }
      .dark ::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.02); 
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1; 
        border-radius: 99px;
        border: 2px solid rgba(0,0,0,0);
        background-clip: padding-box;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #262626; /* Darker thumb */
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
        border: 2px solid rgba(0,0,0,0);
        background-clip: padding-box; 
      }
      .dark ::-webkit-scrollbar-thumb:hover {
        background: #404040; 
      }

      /* Bước 4 — QUAN TRỌNG: hai class ".no-scrollbar" và ".custom-scrollbar"
         được dùng ở hơn 60 chỗ trong component (Header, MainUI, GlossaryTable,
         CreativePage...) nhưng CHƯA TỪNG được định nghĩa ở đâu cả — tức là
         trước giờ không có tác dụng gì. Định nghĩa lại đúng như tên gọi: */

      /* .no-scrollbar: ẩn hẳn thanh cuộn nhưng vẫn cuộn được bằng chuột/
         trackpad/vuốt chạm — dùng cho các thanh công cụ cuộn ngang (hàng
         chọn model, hàng batch/ratio, bottom toolbar) để không lộ thanh
         cuộn ngang chân, gọn hơn. */
      .no-scrollbar {
        scrollbar-width: none;      /* Firefox */
        -ms-overflow-style: none;   /* IE/Edge cũ */
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }

      /* Trên PC (chuột + con trỏ mảnh, khác điện thoại/tablet vốn vuốt
         được trực tiếp), ẩn hẳn thanh cuộn sẽ khiến người dùng không biết
         bấm vào đâu để kéo ngang. Nên chỉ ẩn thanh cuộn trên thiết bị cảm
         ứng (không có hover, con trỏ "thô"); trên PC vẫn hiện thanh cuộn
         ngang mảnh, tinh tế để có thể bấm-giữ-kéo trực tiếp bằng chuột. */
      @media (hover: hover) and (pointer: fine) {
        .no-scrollbar {
          scrollbar-width: thin;
          -ms-overflow-style: auto;
        }
        .no-scrollbar::-webkit-scrollbar {
          display: block;
          height: 6px;
        }
        .no-scrollbar::-webkit-scrollbar-track {
          background: transparent;
        }
        .no-scrollbar::-webkit-scrollbar-thumb {
          background: #cbd5e1;
          border-radius: 99px;
        }
        .dark .no-scrollbar::-webkit-scrollbar-thumb {
          background: #27272a;
        }
        .no-scrollbar::-webkit-scrollbar-thumb:hover {
          background: #94a3b8;
        }
      }

      /* .custom-scrollbar: thanh cuộn dọc/ngang mảnh, tinh tế — dùng cho
         khu vực nội dung dài (danh sách file, bảng thuật ngữ, trang soạn
         thảo...), tách riêng khỏi style scrollbar mặc định để có thể tinh
         chỉnh độ mảnh mà không ảnh hưởng toàn trang. */
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 99px;
      }
      .dark .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #27272a;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
      .dark .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #3f3f46;
      }

      /* Cuộn mượt kiểu momentum trên iOS/Safari cho MỌI vùng có thể cuộn
         (không chỉ 2 class trên) — tránh cảm giác giật cứng khi vuốt trên
         điện thoại/tablet. */
      .custom-scrollbar,
      .no-scrollbar,
      [class*="overflow-y-auto"],
      [class*="overflow-x-auto"] {
        -webkit-overflow-scrolling: touch;
        /* Chặn "scroll chaining": cuộn hết một panel con (danh sách file,
           modal, sidebar...) sẽ không kéo theo panel cha/anh em cuộn ké,
           đúng ý "cuộn lồng nhau không xung đột". */
        overscroll-behavior: contain;
      }

      /* Bước 6 — QUAN TRỌNG: class ".action-btn" được dùng 21 lần trong
         thanh công cụ dưới cùng (Lưu DB/Backup/Restore/Reset/AUTO/Filter/
         Tách Chương/Zip/EPUB...) — thanh công cụ bận rộn nhất toàn app —
         nhưng CHƯA TỪNG được định nghĩa ở đâu, giống lỗi .custom-scrollbar/
         .no-scrollbar đã vá ở Bước 4. Nghĩa là 21 nút này trước giờ hiển
         thị KHÔNG có kích thước/khoảng đệm/hover/focus gì cả. Định nghĩa
         lại đúng theo kiểu dáng các nút liền kề (Thêm/Paste) đã có sẵn. */
      .action-btn {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-width: 40px;
        height: 40px;
        padding: 4px;
        border-radius: 0.5rem;
        border: 1px solid transparent;
        cursor: pointer;
        transition: all 200ms cubic-bezier(0.4, 0, 0.2, 1);
      }
      .action-btn:hover {
        background-color: #f8fafc; /* slate-50 */
        border-color: #e2e8f0; /* slate-200 */
      }
      .dark .action-btn:hover {
        background-color: #1e293b; /* slate-800 */
        border-color: #334155; /* slate-700 */
      }
      .action-btn:active {
        transform: scale(0.95);
      }
      .action-btn:focus-visible {
        outline: none;
        box-shadow: 0 0 0 2px #818cf8; /* primary-400 */
      }
      .action-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
      }

      .glass-panel {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.6);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.03);
      }
      
      .dark .glass-panel {
        background: #0a0a0a; /* Solid dark for Zen, less glass */
        border: 1px solid #1a1a1a;
      }
      
      .safe-pb {
        padding-bottom: env(safe-area-inset-bottom);
      }
    </style>
